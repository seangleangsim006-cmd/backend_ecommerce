    put:
      summary: Update order status
      tags: [Merchant]
      security:
        - bearerAuth: []
      x-roles: [merchant]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: new status (e.g., accepted, preparing, completed)
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'

